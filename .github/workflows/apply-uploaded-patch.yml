name: Apply uploaded ConflictWatch patch

on:
  pull_request:
    branches:
      - main
    paths:
      - '.patches/**'
      - '.github/workflows/apply-uploaded-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Check whether staging files remain
        id: gate
        shell: bash
        run: |
          if [[ -f .patches/p1_1.b64 ]]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruct uploaded patch series
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .patches/p1_*.b64 | base64 -d | gzip -d > /tmp/p1.patch
          cat .patches/p2_*.b64 | base64 -d | gzip -d > /tmp/p2.patch
          cat .patches/p3_*.b64 | base64 -d | gzip -d > /tmp/p3.patch
          cat .patches/p4_*.b64 | base64 -d | gzip -d > /tmp/p4.patch

      - name: Apply exact four-commit series
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git am --3way /tmp/p1.patch /tmp/p2.patch /tmp/p3.patch /tmp/p4.patch

      - name: Run full test suite
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -t . -q

      - name: Package verified target tree
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/verified-tree
          mkdir -p /tmp/verified-tree
          git archive HEAD | tar -x -C /tmp/verified-tree
          rm -rf /tmp/verified-tree/.patches
          rm -f /tmp/verified-tree/.github/workflows/apply-uploaded-patch.yml
          tar -czf /tmp/conflictwatch-verified.tar.gz -C /tmp/verified-tree .

      - name: Upload verified target tree
        if: steps.gate.outputs.apply == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: conflictwatch-verified-target
          path: /tmp/conflictwatch-verified.tar.gz
          retention-days: 1

      - name: Squash verified code changes except protected workflow
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/pipeline.yml /tmp/verified-pipeline.yml
          git reset --soft origin/${{ github.head_ref }}
          git restore --source=origin/${{ github.head_ref }} --staged --worktree .github/workflows/pipeline.yml
          rm -rf .patches
          git add -A
          git commit -m "Apply verified quake impact and public release series"

      - name: Push verified non-workflow changes
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:${{ github.head_ref }}
