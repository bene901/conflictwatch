name: Tests
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # tests/test_recency_basis.py fuehrt site/app.js in node aus. Fehlt node, wuerden
      # sich diese Tests still ueberspringen - der Lauf bliebe gruen, ohne die
      # Aktualitaetsregel geprueft zu haben. Deshalb hier laut scheitern.
      - run: node --version
      - run: python -m unittest discover -s tests -t . -v
