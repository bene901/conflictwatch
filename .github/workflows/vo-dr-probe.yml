name: VO DR source probe
on:
  push:
    branches:
      - probe/vo-dr-source
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect official GDACS VO and DR feeds
        run: |
          set -euo pipefail
          for kind in VO DR; do
            url="https://www.gdacs.org/contentdata/xml/gdacs${kind}.geojson"
            echo "=== ${kind} ==="
            curl -fsSL --max-time 45 --retry 2 "$url" -o "${kind}.json"
            wc -c "${kind}.json"
            jq -r '"type=" + (.type // "null") + " features=" + ((.features|length)|tostring)' "${kind}.json"
            jq -r '[.features[].properties.eventtype] | group_by(.) | map({eventtype:.[0],count:length})' "${kind}.json"
            jq -r '.features[0:3][] | {geometry:.geometry.type,properties:(.properties|with_entries(select(.key as $k | ["eventtype","eventid","episodeid","name","alertlevel","alertscore","fromdate","todate","datemodified","iscurrent","affectedcountries","severitydata","url"]|index($k))))}' "${kind}.json"
          done
