name: VO DR source probe
on:
  push:
    branches:
      - probe/vo-dr-source
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Emit authentic compact fixtures
        run: |
          set -euo pipefail
          curl -fsSL --max-time 45 --retry 2 "https://www.gdacs.org/contentdata/xml/gdacsDR.geojson" -o DR.json
          jq -c '[.features[] | select(.geometry.type=="Point" and .properties.Class=="Point_Centroid")][0]' DR.json > dr_point.json
          curl -fsSL --max-time 45 --retry 2 "https://www.gdacs.org/gdacsapi/api/events/geteventdata?eventtype=VO&eventid=1000145" -o vo_event.json
          echo "DR_FIXTURE_B64"
          base64 -w0 dr_point.json
          echo
          echo "VO_FIXTURE_B64"
          base64 -w0 vo_event.json
          echo
